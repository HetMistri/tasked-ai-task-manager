server {
    listen 5173;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # Resolve service names at request time through Docker's embedded DNS.
    # If the AI service is stopped, nginx still starts and /api keeps working;
    # only /ai returns 502.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $task_api http://task-service:8000;
    set $ai_api http://ai-service:8001;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location /api/ {
        # Strip the /api prefix: the Core Task API serves /tasks, /auth, ...
        rewrite ^/api/(.*)$ /$1 break;
        proxy_pass $task_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    location /ai/ {
        proxy_pass $ai_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_cache_bypass $http_upgrade;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        # Gemini occasionally returns a transient 504. The AI service retries
        # once, so allow more than the provider timeout before giving up.
        proxy_read_timeout 120s;
    }
}
